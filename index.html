<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>بلانر بيتي</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="بلانر رقمي للبيت: تنظيف، مطبخ، ميزانية، أطفال ومواعيد — بالعربي.">
<meta name="theme-color" content="#eff3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بلانر بيتي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: phone-width column. Sticky pill tabs per section, white cards on a cool sage ground, fixed bottom nav with a "more" sheet. */
:root {
  --bg: #eff3f1;
  --surface: #ffffff;
  --ink: #1d2b26;
  --muted: #7a8a83;
  --chip: #e4eae7;
  --chip-2: #cbd6d1;
  --line: #dfe5e2;
  --accent: #1b5e50;
  --accent-ink: #ffffff;
  --tint: #dfeee7;
  --box: #f6f8f7;
  --box-line: #d5ddd9;
  --mint: #d8eee4;
  --mint-ink: #25483d;
  --note-bg: #f1e3ca;
  --note-ink: #7b5b2b;
  --amber: #b8801f;
  --amber-bg: #f6e7c8;
  --ok: #2d8a64;
  --bad: #b5483b;
  --rose: #a8465f;
  --rose-bg: #f8dde4;
  --rose-ink: #8a3550;
  --rose-line: #f0cfd8;
  --hero: #1d6a5c;
  --hero-2: #16574b;
  --shadow: rgba(27, 94, 80, 0.45);
  --font: 'Cairo', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1613; --surface: #16211d; --ink: #e7efec; --muted: #8fa39b; --chip: #202e29; --chip-2: #36483f;
    --line: #243530; --accent: #2a8670; --accent-ink: #ffffff; --tint: #1d3a31; --box: #1a2823;
    --box-line: #31453e; --mint: #1a3a30; --mint-ink: #cfe8dd; --note-bg: #3a2f1c; --note-ink: #e4c991;
    --amber: #d6a047; --amber-bg: #3b3019; --ok: #3aa377; --bad: #e5897c; --rose: #c45d79;
    --rose-bg: #3d2430; --rose-ink: #f0b6c6; --rose-line: #583543; --hero: #174d43; --hero-2: #103a33;
    --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1613; --surface: #16211d; --ink: #e7efec; --muted: #8fa39b; --chip: #202e29; --chip-2: #36483f;
  --line: #243530; --accent: #2a8670; --accent-ink: #ffffff; --tint: #1d3a31; --box: #1a2823;
  --box-line: #31453e; --mint: #1a3a30; --mint-ink: #cfe8dd; --note-bg: #3a2f1c; --note-ink: #e4c991;
  --amber: #d6a047; --amber-bg: #3b3019; --ok: #3aa377; --bad: #e5897c; --rose: #c45d79;
  --rose-bg: #3d2430; --rose-ink: #f0b6c6; --rose-line: #583543; --hero: #174d43; --hero-2: #103a33;
  --shadow: rgba(0, 0, 0, 0.55); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  direction: rtl; -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg);
}
button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.shell {
  max-width: 520px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack > * { min-width: 0; }

/* tabs and chips */
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: flex; gap: 10px; overflow-x: auto; padding-block: 14px 12px; scrollbar-width: none;
}
.tabs.static { position: static; padding-block: 4px 0; }
.tabs::-webkit-scrollbar, .scroll-row::-webkit-scrollbar { display: none; }
.tab {
  flex: none; height: 44px; padding: 0 22px; border-radius: 99px; background: var(--chip);
  color: var(--muted); font-weight: 600; white-space: nowrap;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: 0 8px 18px -8px var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.scroll-row { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.chip {
  flex: none; min-height: 42px; padding: 0 20px; border-radius: 99px; background: var(--chip); color: var(--muted);
  font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; border: 2px solid transparent;
}
.chip.room[aria-pressed="true"] { background: var(--tint); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip.freq[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip .cnt { font-size: 13px; opacity: .85; font-variant-numeric: tabular-nums; }
.chip.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, transparent); background: var(--surface); }
.chip.outline { background: var(--surface); border-color: var(--box-line); color: var(--ink); font-weight: 600; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.chip[aria-pressed="true"] .dot { background: var(--accent-ink); }
.chip svg { width: 16px; height: 16px; }

/* cards + headers */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 26px; padding: 18px;
  display: flex; flex-direction: column; gap: 14px; min-width: 0;
}
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 46px; }
.sec-title { font-size: 22px; font-weight: 700; min-width: 0; line-height: 1.3; }
.sec-title.muted { font-size: 15px; font-weight: 500; color: var(--muted); }
.sec-sub { color: var(--muted); font-size: 15px; margin-top: -8px; }
.pill-btn {
  height: 44px; padding: 0 22px; border-radius: 16px; background: var(--surface);
  border: 1px solid var(--box-line); font-weight: 600; flex: none;
}
.pill-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.outer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.outer-head .lbl { color: var(--muted); font-size: 15px; font-weight: 500; }
.hint { color: var(--muted); font-size: 14.5px; }

/* inputs */
.inp {
  width: 100%; min-width: 0; height: 52px; padding: 0 16px; border-radius: 17px; border: 1px solid var(--box-line);
  background: var(--surface); outline: none; appearance: none; -webkit-appearance: none;
}
.inp::placeholder { color: var(--muted); opacity: .85; }
.inp:focus { border-color: var(--accent); }
select.inp {
  padding-inline-end: 38px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
  direction: rtl;
}
[dir="rtl"] select.inp { background-position: 20px 50%, 14px 50%; }
.num { font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.add-row { display: flex; gap: 12px; align-items: center; }
.add-row .inp { flex: 1; }
.add-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.add-grid .grow { grid-column: 1 / -1; }
.btn-sq {
  flex: none; width: 54px; height: 54px; border-radius: 18px; background: var(--ck, var(--accent));
  color: var(--accent-ink); display: grid; place-items: center;
}
.btn-sq svg { width: 24px; height: 24px; }
.btn-wide {
  width: 100%; min-height: 54px; border-radius: 18px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.btn-wide.outline { background: var(--surface); color: var(--ink); border: 1px solid var(--box-line); font-weight: 600; }
.btn-wide svg { width: 22px; height: 22px; }

/* tasks / checklists */
.tasks { list-style: none; margin: 0; padding: 0; }
.task { display: flex; align-items: center; gap: 16px; min-height: 62px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.task:last-child { border-bottom: 0; }
.check {
  flex: none; width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--ck-line, var(--box-line));
  background: var(--box); display: grid; place-items: center; color: var(--accent-ink);
}
.check svg { width: 22px; height: 22px; opacity: 0; }
.check[aria-checked="true"] { background: var(--ck, var(--accent)); border-color: var(--ck, var(--accent)); }
.check[aria-checked="true"] svg { opacity: 1; }
.task-text { flex: 1; min-width: 0; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; }
.task-text .tag { color: var(--muted); font-size: 14px; font-weight: 400; }
.task.done .task-text { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.task-text .inp { height: 42px; border-radius: 12px; font-weight: 500; }
.del {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: var(--bad);
  background: var(--box); border: 1px solid var(--box-line);
}
.del.sm { width: 38px; height: 38px; border-radius: 12px; }
.del svg { width: 20px; height: 20px; }
.del.sm svg { width: 17px; height: 17px; }
.empty { color: var(--muted); text-align: center; padding: 22px 8px; }
.rose { --ck: var(--rose); --ck-line: var(--rose-line); }

/* banners */
.note {
  background: var(--note-bg); color: var(--note-ink); border-radius: 20px; padding: 16px 18px; display: flex; gap: 12px;
  align-items: flex-start; font-weight: 500; font-size: 15px;
}
.note svg { flex: none; width: 22px; height: 22px; margin-top: 2px; }
.note.mint { background: var(--mint); color: var(--mint-ink); font-size: 16.5px; line-height: 1.75; }
.note.mint b { color: var(--ink); }
.note.pinky { background: var(--rose-bg); color: var(--rose-ink); display: block; padding: 20px; }
.note.pinky h2 { margin: 0 0 6px; font-size: 24px; line-height: 1.5; font-weight: 700; }
.note.pinky p { margin: 0; color: var(--ink); font-weight: 500; font-size: 16px; }

/* bottom nav + sheet */
.nav {
  position: fixed; inset: auto 0 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.nav-in { max-width: 520px; margin-inline: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 16px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.nav button svg { width: 24px; height: 24px; }
.nav button[aria-current="page"] { color: var(--accent); background: var(--tint); }
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(10, 20, 17, .45); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 520px; background: var(--surface); border-radius: 28px 28px 0 0; padding: 12px 14px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}
.sheet .grab { width: 44px; height: 5px; border-radius: 99px; background: var(--chip); margin: 0 auto 14px; }
.sheet-item { width: 100%; display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 18px; font-size: 18px; font-weight: 600; text-align: start; }
.sheet-item svg { width: 24px; height: 24px; color: var(--muted); }
.sheet-item[aria-current="page"] { background: var(--tint); color: var(--accent); }
.sheet-item[aria-current="page"] svg { color: var(--accent); }
.toast {
  position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 99px; font-weight: 600; max-width: 90vw;
}

/* home */
.hero {
  position: relative; overflow: hidden; border-radius: 28px; color: #fff; margin-top: 14px;
  background: linear-gradient(140deg, var(--hero), var(--hero-2));
}
.hero .pat { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-in { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 22px 20px; }
.hero-txt { min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.hello { font-size: 15px; opacity: .85; }
.hero h1 { margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700; }
.hero .pill { background: rgba(255, 255, 255, .16); border-radius: 99px; padding: 6px 16px; font-size: 15px; font-weight: 600; }
.ring { position: relative; width: 98px; height: 98px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .lab { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; }
.ring b { font-size: 22px; font-variant-numeric: tabular-nums; }
.ring small { font-size: 11.5px; opacity: .9; }
.agenda-title { display: flex; align-items: baseline; justify-content: space-between; margin-top: 6px; }
.agenda-title h2 { margin: 0; font-size: 24px; font-weight: 700; }
.group { padding-block: 4px; }
.group + .group { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 14px; }
.g-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.g-head .t { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--accent); font-size: 17px; }
.g-head .t svg { width: 22px; height: 22px; }
.g-head .open { display: flex; align-items: center; color: var(--muted); font-size: 15px; gap: 2px; }
.g-head .open svg { width: 16px; height: 16px; }
.row-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: start; padding-block: 10px; min-height: 62px; }
.row-link .t { font-size: 17px; font-weight: 600; }
.row-link .s { color: var(--muted); font-size: 14px; }
.row-link svg { width: 18px; height: 18px; color: var(--muted); }

/* stock */
.seg { display: flex; flex-wrap: wrap; gap: 8px; }
.seg button { padding: 7px 18px; border-radius: 14px; background: var(--chip); color: var(--muted); font-weight: 500; }
.seg button.s-ok[aria-pressed="true"] { background: var(--ok); color: #fff; font-weight: 600; }
.seg button.s-low[aria-pressed="true"] { background: var(--amber); color: #fff; font-weight: 600; }
.seg button.s-out[aria-pressed="true"] { background: var(--bad); color: #fff; font-weight: 600; }
.item-block { padding-block: 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.item-block:last-child { border-bottom: 0; }
.item-name { font-size: 20px; font-weight: 700; }
.cat-lbl { color: var(--muted); font-size: 15px; }
.tag-pill { align-self: flex-start; background: var(--amber-bg); color: var(--note-ink); font-weight: 600; border-radius: 99px; padding: 6px 18px; }
.big { font-size: 34px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }

/* meals table */
.table-wrap { overflow-x: auto; margin-inline: -4px; padding-inline: 4px; }
table.meals { border-collapse: separate; border-spacing: 8px 10px; min-width: 100%; }
.meals th { color: var(--muted); font-weight: 500; font-size: 14.5px; text-align: start; padding: 0 4px; }
.meals td.day { font-weight: 700; white-space: nowrap; padding-inline: 4px; }
.meals td.day.today { color: var(--accent); }
.meals .cell { min-width: 150px; height: 48px; border-radius: 14px; border: 2px solid transparent; background: var(--chip); padding: 0 14px; outline: none; width: 100%; }
.meals .cell:focus { background: var(--surface); border-color: var(--accent); }

/* bank / shop / money */
.time-pill { background: var(--chip); color: var(--muted); border-radius: 99px; padding: 4px 16px; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.place-btn { align-self: flex-start; padding: 10px 22px; border-radius: 16px; background: var(--chip); font-weight: 600; }
.place-panel { background: var(--box); border: 1px solid var(--box-line); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.price { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; min-width: 44px; text-align: start; }
.price-inp { width: 96px; height: 42px; border-radius: 12px; padding: 0 10px; }
.shop-total { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.shop-total .k { color: var(--muted); font-size: 15px; }
.shop-total .v { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.v-ok { color: var(--ok); } .v-bad { color: var(--bad); } .v-amber { color: var(--amber); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 15px; }
.stat .v { font-size: 34px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums; }
.month-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 14px; }
.month-bar .m { font-weight: 700; font-size: 20px; }
.month-bar button { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--box-line); display: grid; place-items: center; }
.month-bar svg { width: 18px; height: 18px; }
.frow { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.frow:last-child { border-bottom: 0; }
.frow > label { color: var(--muted); flex: none; width: 34%; }
.frow .inp { height: 46px; border-radius: 16px; }
.frow .amt { width: 112px; height: 46px; border-radius: 14px; }
.ex-row { display: flex; align-items: center; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.ex-row .nm { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.ex-row .nm small { display: block; color: var(--muted); font-weight: 400; font-size: 13px; }
.ex-row .a { font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { font-size: 12.5px; font-weight: 700; padding: 2px 12px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.warn { background: var(--amber-bg); color: var(--note-ink); }
.badge.late { background: var(--bad); color: #fff; }
.mini-btn { padding: 8px 16px; border-radius: 12px; background: var(--tint); color: var(--accent); font-weight: 700; flex: none; }
.bar { height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--ck, var(--accent)); }
.goal-top { display: flex; align-items: baseline; gap: 10px; }
.goal-top .of { color: var(--muted); }
.goal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
.goal-foot .add-row { flex: none; width: 52%; }
.goal-foot .inp { height: 46px; border-radius: 14px; }
.goal-foot .btn-sq { width: 46px; height: 46px; border-radius: 14px; }

/* kids */
.avatar { width: 58px; height: 58px; border-radius: 17px; background: var(--tint); color: var(--accent); display: grid; place-items: center; font-size: 26px; font-weight: 700; flex: none; }
.kid-head { display: flex; align-items: center; gap: 14px; }
.kid-head .nm { flex: 1; min-width: 0; }
.kid-head .nm input { width: 100%; border: 0; background: none; font-size: 22px; font-weight: 700; outline: none; padding: 0; border-radius: 8px; }
.kid-head .nm input:focus { background: var(--box); }
.kid-head .sub { color: var(--muted); font-size: 15px; }
.xbtn { color: var(--muted); width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; align-self: flex-start; }
.xbtn svg { width: 20px; height: 20px; }
.xbtn.confirm { color: #fff; background: var(--bad); width: auto; padding: 0 14px; font-size: 14px; font-weight: 700; }

/* bags / calendar / water */

.cal-grid .d {

  justify-content: center; gap: 2px; font-weight: 500; font-variant-numeric: tabular-nums; border: 2px solid transparent; min-width: 0;
}
.cal-grid .d.today { color: var(--accent); font-weight: 700; }

.cal-grid .d i.none { background: transparent; }
.iso { color: var(--muted); letter-spacing: .5px; font-size: 15px; font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.water { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.water button { height: 52px; border-radius: 16px; background: var(--chip); }
.water button[aria-pressed="true"] { background: var(--accent); }

@media (prefers-reduced-motion: no-preference) {

      case 'ddel': { var dl = list('deep.' + ui.rp), di = dl.findIndex(function (x) { return x.id === id; }); if (di > -1) dl.splice(di, 1); ui.et = ''; ui.confirm = ''; changed = true; break; }
      case 'bkdl': downloadBackup(); break;
      case 'bkfile': document.getElementById('bkfile').click(); break;
      case 'bkcopy':
        ui.bk = ui.bk === 'copy' ? '' : 'copy';
        if (ui.bk === 'copy') { try { navigator.clipboard.writeText(backupText()).then(function () { toast('اتنسخ النص'); }, function () { toast('انسخي النص من الخانة بإيدك'); }); } catch (e) { toast('انسخي النص من الخانة بإيدك'); } }
        break;
      case 'bkpaste': ui.bk = ui.bk === 'paste' ? '' : 'paste'; ui.confirm = ''; break;
      case 'bkask': {
        var okb = null; try { okb = parseBackup(D('bk:t')); } catch (e) {}
        if (okb) ui.confirm = 'bk'; else toast('النص ده مش نسخة احتياطية من البلانر');
        break;
      }
      case 'bkapply': {
        var nb = null; try { nb = parseBackup(D('bk:t')); } catch (e) {}
        if (!nb) { ui.confirm = ''; toast('النص ده مش نسخة احتياطية من البلانر'); break; }
        S = nb; delete ui.drafts['bk:t']; ui.bk = ''; ui.confirm = ''; ui.rp = null; ui.edit = null; ui.et = '';
        if (!findId(S.clean.rooms, ui.room)) ui.room = S.clean.rooms[0].id;
        saveUi(); changed = true; toast('اتسترجعت البيانات'); break;
      }
      case 'dflt': ui.df = id; break;
      case 'dpf': ui.dp = id; break;
      case 'askdclear': ui.confirm = 'clear'; break;
      case 'dclear': S.deep[ui.rp] = list('deep.' + ui.rp).filter(function (x) { return x.st !== 'done'; }); ui.confirm = ''; changed = true; break;
      case 'askdelroomx': ui.confirm = 'room'; break;
      case 'delroomx': {
        var rid = ui.rp;
        S.clean.rooms = S.clean.rooms.filter(function (x) { return x.id !== rid; }); delete S.deep[rid];
        Object.keys(S.clean.tasks).forEach(function (k) { if (k.indexOf(rid + '|') === 0) delete S.clean.tasks[k]; });
        if (ui.room === rid) ui.room = S.clean.rooms[0].id;
        ui.rp = null; ui.edit = null; ui.confirm = ''; saveUi(); changed = true; break;
      }
      default: return;
    }
    if (changed) save();
    render();
  });

  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.draft) { ui.drafts[el.dataset.draft] = el.value; }
    if (el.dataset.bind) {
      var v = el.dataset.num ? toNum(el.value) : el.value;
      setPath(el.dataset.bind, v); save();
      if (el.dataset.rr && !(el.dataset.num && /[.,٫]$/.test(el.value))) render();
    }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id !== 'bkfile' || !el.files || !el.files[0]) return;
    var fr = new FileReader();
    fr.onload = function () { ui.drafts['bk:t'] = String(fr.result); ui.bk = 'paste'; ui.confirm = ''; render(); toast('اتقرا الملف — اضغطي استرجاع'); };
    fr.readAsText(el.files[0]); el.value = '';
  });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });

  if (migratedLocal) save();
  render();
})();
</script>
<script src="pwa.js" defer></script>
